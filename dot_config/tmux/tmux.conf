# tmux configuration.
#
# Read by the tmux server when it starts, and again by
# `tmux source ~/.config/tmux/tmux.conf` (or prefix r) in a running server.
# Tracked by chezmoi; anything machine-specific belongs in
# ~/.config/tmux/tmux.local.conf, which is untracked and sourced last. Full
# reference: https://man.openbsd.org/tmux
#
# Each option takes effect as its line is read, so sections follow the path of
# a keypress: the outer terminal, then input, then tmux's own keys, and then
# the history it keeps. Two things depend on order:
#   1. TPM runs after every @plugin line, since it reads them to decide what
#      to load.
#   2. Local overrides come last, so they win over everything above.
#
# Kept in sync with ~/.config/ghostty/config
#   - terminal-features names xterm-ghostty, the TERM Ghostty sets, and only
#     features Ghostty supports.
#   - history-limit matches scrollback-limit (100MB, roughly 100k lines).
#   - set-clipboard relies on Ghostty accepting OSC 52 clipboard writes.
#
# Kept in sync with ~/.config/nvim/lua/config/options.lua
#   - mouse on is what lets Neovim's mouse = "a" receive the mouse.
#   - The C-a prefix leaves Neovim's <C-b> free.
#
# Kept in sync with ~/.config/nvim/lua/plugins/editor/smart-splits.lua
#   - C-h/j/k/l and M-h/j/k/l read @pane-is-vim, which smart-splits sets, to
#     choose between passing the key to Neovim and acting on tmux panes.
#   - The 3-cell resize step matches smart-splits' default resize amount.

# =============================================================================
# Terminal
# =============================================================================

# Programs inside tmux see this TERM. Its terminfo entry describes tmux itself,
# including italics, which the older "screen" entries lack.
set -g default-terminal "tmux-256color"

# tmux only passes through what it knows the outer terminal supports. Ghostty
# has 24-bit colour (RGB) and curly, coloured underlines (usstyle), which
# Neovim uses for truecolor themes and diagnostic undercurls.
set -as terminal-features ",xterm-ghostty:RGB:usstyle"

# Lets tmux and the programs inside it write the system clipboard through
# Ghostty (OSC 52). Must be on: the default, external, lets tmux's own copies
# through but drops those from programs, such as Neovim over SSH.
set -s set-clipboard on

# =============================================================================
# Input
# =============================================================================

# Milliseconds tmux waits after <Esc> to see if it starts an Alt or escape
# sequence. The default 500 makes leaving insert mode in Neovim feel slow.
set -sg escape-time 10

# Tells programs when their pane gains or loses focus, so Neovim can reload
# files that changed elsewhere while you were away.
set -g focus-events on

# Passes clicks, scrolling and drags to programs; see "Kept in sync" above.
# Dragging in a shell selects in copy mode and copies on release. Hold Shift
# while dragging to use Ghostty's own selection instead.
set -g mouse on

# =============================================================================
# Keybindings
# =============================================================================

# --- Prefix ------------------------------------------------------------------

# C-a instead of C-b; see "Kept in sync" above. Pressing C-a twice sends a
# real C-a, which Neovim uses to increment a number.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reloads this file without restarting the server, so running sessions keep
# their windows.
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- Windows and splits ------------------------------------------------------

# Numbers windows and panes from 1, so they match the order of the number
# keys, and closes the gap a closed window leaves.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# | and - split side by side and top to bottom, drawn like the line they add.
# They and c open in the current pane's directory; % and " keep tmux's default
# of the directory the session started in.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# --- Pane navigation ---------------------------------------------------------

# Without the prefix, the same keys move and resize across Neovim splits and
# tmux panes. In a Neovim pane tmux passes the key on, and smart-splits hands
# it back at the edge of Neovim's splits; see "Kept in sync" above:
#   C-h/j/k/l  move to the pane on the left, below, above or right
#   M-h/j/k/l  resize the pane towards that side, 3 cells per press
bind -n C-h if -F "#{@pane-is-vim}" 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F "#{@pane-is-vim}" 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F "#{@pane-is-vim}" 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F "#{@pane-is-vim}" 'send-keys C-l' 'select-pane -R'
bind -n M-h if -F "#{@pane-is-vim}" 'send-keys M-h' 'resize-pane -L 3'
bind -n M-j if -F "#{@pane-is-vim}" 'send-keys M-j' 'resize-pane -D 3'
bind -n M-k if -F "#{@pane-is-vim}" 'send-keys M-k' 'resize-pane -U 3'
bind -n M-l if -F "#{@pane-is-vim}" 'send-keys M-l' 'resize-pane -R 3'

# C-l above no longer reaches the shell, so prefix C-l sends it to clear the
# screen.
bind C-l send-keys C-l

# =============================================================================
# Scrollback
# =============================================================================

# Lines kept per pane. tmux keeps its own history, so Ghostty's scrollback
# goes unused inside it; see "Kept in sync" above.
set -g history-limit 100000

# --- Copy mode ---------------------------------------------------------------

# Copy mode (prefix [) uses vi keys. v starts a selection and y copies it to
# the system clipboard (see set-clipboard above) and leaves copy mode.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# The pane navigation keys above, so leaving copy mode is not needed to move.
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# =============================================================================
# Plugins
# =============================================================================

# --- tmux-resurrect ----------------------------------------------------------

# tmux-resurrect: saves sessions, windows, panes and their directories
# (prefix C-s) and restores them (prefix C-r). Neovim is rerun with the
# command line it was started with (`nvim`, `nvim .`, `nvim file`), so files
# opened later and splits are not reopened; <leader>qs in Neovim restores
# them from persistence.nvim's session. Pane contents are saved too, so a
# restored shell still shows its last output.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

# --- tmux-continuum ----------------------------------------------------------

# tmux-continuum: saves through tmux-resurrect every 15 minutes, and restores
# the last save when the tmux server starts, so sessions survive a reboot.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# --- TPM ---------------------------------------------------------------------

# TPM: installs (prefix I) and updates (prefix U) the plugins above into
# ~/.config/tmux/plugins/. Last of the plugins: it loads only the @plugin
# lines read before it.
set -g @plugin 'tmux-plugins/tpm'
run '~/.config/tmux/plugins/tpm/tpm'

# =============================================================================
# Local overrides
# =============================================================================

# Machine-specific settings, deliberately untracked by chezmoi. -q skips the
# file quietly when it does not exist.
source-file -q ~/.config/tmux/tmux.local.conf
