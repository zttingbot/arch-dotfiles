# Starship configuration.
#
# Read by `starship prompt` each time the shell draws a prompt, so an edit
# shows on the next one. .zshrc points STARSHIP_CONFIG here in graphical
# terminals only; the Linux console gets a plain zsh prompt instead. Top-level
# keys come before the first [table], since TOML files every key after a table
# header under that table, and the tables then follow the prompt left to
# right, in the order of format. A module in format with no table here, such
# as directory or character, runs on starship's defaults.
# Full reference: https://starship.rs/config/
#
# Colors
#   Styles name ANSI colors, so the terminal's palette sets the hexes. The
#   directory, branch, prompt character and language modules keep starship's
#   default colors.
#   - Cyan: the directory.
#   - Purple: the git branch.
#   - Red: git status, and the prompt character after a failed command.
#   - Green: the prompt character after a successful one.
#   - Yellow: how long the last command took.
#   - Dimmed: the connecting words on, via and took.
#
# Conventions
#   - Nerd Font glyphs are written as escapes, since these private-use
#     codepoints are invisible in most editors. A trailing comment gives each
#     one's Nerd Fonts name, searchable at
#     https://www.nerdfonts.com/cheat-sheet. Ghostty's MonoLisa Nerd Font
#     Mono draws them.

"$schema" = 'https://starship.rs/config-schema.json'

# =============================================================================
# Layout
# =============================================================================

# One line of context, then the input on the next line, with no blank line
# before the prompt.
format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$cmd_duration\
$line_break\
$character"""
add_newline = false

# =============================================================================
# Modules
# =============================================================================

# --- Git ---------------------------------------------------------------------

[git_branch]
symbol = "\uF418 " # oct-git_branch
format = "[on](dimmed) [$symbol$branch]($style) "

# A compact summary of the working tree, such as !? for changes and untracked
# files, or ⇡ when ahead of the remote; nothing at all when clean.
[git_status]
style = "red"
format = "([$all_status$ahead_behind]($style) )"

# --- Languages ---------------------------------------------------------------

# Each shows only in a directory that uses its toolchain, with the version
# in use. nodejs needs no symbol line: starship's own glyph for it is already
# dev-nodejs_small.
[nodejs]
format = "[via](dimmed) [$symbol($version )]($style)"

[python]
symbol = "\uE235 " # fae-python
format = "[via](dimmed) [$symbol($version )]($style)"

[rust]
symbol = "\uE7A8 " # dev-rust
format = "[via](dimmed) [$symbol($version )]($style)"

[golang]
symbol = "\uE627 " # seti-go
format = "[via](dimmed) [$symbol($version )]($style)"

[docker_context]
symbol = "\uF308 " # linux-docker
format = "[via](dimmed) [$symbol$context]($style) "

# --- Command duration --------------------------------------------------------

# Shown only when the last command ran 2s or longer, starship's default
# threshold.
[cmd_duration]
format = "[took](dimmed) [$duration](yellow) "
