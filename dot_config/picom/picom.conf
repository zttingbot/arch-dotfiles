# picom configuration.
#
# Read once by picom at startup; i3's autostart launches it with --config
# pointing here, so no other picom.conf is read and unset keys keep picom's
# defaults. The global keys are independent, so their order only groups them;
# the window rules come last because each one overrides them for the windows
# it matches. rofi's translucent popup, dunst's transparency and Ghostty's
# background-opacity only take effect while picom is compositing.
# Full reference: https://picom.app/
#
# Kept in sync with ~/.config/ghostty/config
#   - Blur is on, and Ghostty's background-opacity is lowered so it shows
#     through.
#
# Kept in sync with ~/.config/rofi/themes/neon.rasi
#   - Blur is on, and rofi's bg0 alpha is lowered so it shows through.

# =============================================================================
# Backend
# =============================================================================

# glx composites on the GPU through OpenGL, rather than through the X Render
# extension as the default xrender does. vsync paces frames to the display's
# refresh, so windows do not tear as they redraw. The blur below needs glx.
backend = "glx";
vsync = true;

# =============================================================================
# Effects
# =============================================================================

# --- Shape and motion --------------------------------------------------------

# picom's defaults, pinned so the look stays flat and square, like i3's
# borders: no rounded corners, no drop shadows, no fade on open or close.
corner-radius = 0;
shadow = false;
fading = false;

# --- Blur --------------------------------------------------------------------

# Frosts whatever sits behind a translucent window (Ghostty, rofi, dunst), so
# text on top stays readable over a busy background. dual_kawase is the
# cheapest good-looking method on the GPU; strength runs from 1 to 20, and 5
# softens shapes behind the window without washing them out completely.
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;

# =============================================================================
# Window rules
# =============================================================================

# Windows that must not be blurred:
#   - dock: i3bar, which is opaque, so blurring behind it only costs GPU time.
#   - slop: the full-screen overlay `maim -s` draws while selecting a region
#     (~/.local/bin/screenshot region); blurred, it hides what is being
#     selected.
#   - _GTK_FRAME_EXTENTS: the transparent shadow margin around GTK windows
#     that draw their own decorations; blurred, it shows as a smeared box.
#     Ghostty does not set it.
rules: (
  {
    match = "window_type = 'dock' || "
            "class_g = 'slop' || "
            "_GTK_FRAME_EXTENTS@";
    blur-background = false;
  },
)
