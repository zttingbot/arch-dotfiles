# chezmoi externals.
#
# Read by `chezmoi apply`, which clones each entry into place when it is
# missing. Full reference:
# https://www.chezmoi.io/reference/special-files/chezmoiexternal-format/
#
# Kept in sync with ~/.config/tmux/tmux.conf
#   - The tpm path is the one tmux.conf runs.
#
# Kept in sync with run_onchange_before_install-packages.sh
#   - It installs git, which git-repo entries are cloned with, before they run.

# TPM: a git checkout rather than an archive, since TPM updates itself with
# git (prefix U). With no refreshPeriod chezmoi never pulls it, so it only
# clones TPM on a new machine.
[".config/tmux/plugins/tpm"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tpm"
